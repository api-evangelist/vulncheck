      x-operation-id-source: derived
  /purl:
    get:
      description: Based on the specified PURL, this endpoint will return a list of vulnerabilities that are related to the package. We currently support hex, golang, hackage, npm, and pypi
      parameters:
      - description: URL string used to identify and locate a software package
        in: query
        name: purl
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/render.ResponseWithMetadata-v3controllers_PurlResponseData-v3controllers_PurlResponseMetadata'
          description: OK
        '404':
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Request vulnerabilities related to a PURL
      tags:
      - Endpoints
      operationId: getPurl
      x-operation-id-source: derived
  /purls:
    post:
      description: Accepts a JSON array of PURLs in the request body and returns a list of vulnerabilities
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              title: purls
              type: array
        description: PURL strings used to identify and locate software packages
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/render.ResponseWithMetadata-v3controllers_PurlsResponseData-v3controllers_PurlsResponseMetadata'
          description: OK
        '404':
          content:
