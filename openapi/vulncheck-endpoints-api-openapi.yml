      operationId: getRulesInitialAccessByType
      x-operation-id-source: derived
  /search/cpe:
    get:
      description: Based on the specified CPE (Common Platform Enumeration) fields, this endpoint will return a list of matching CPEs and the related CVE vulnerabilities.
      parameters:
      - description: CPE part to lookup
        example: '[a]pplication, [o]perating system, [h]ardware'
        in: query
        name: part
        schema:
          type: string
      - description: CPE vendor to lookup
        in: query
        name: vendor
        schema:
          type: string
      - description: CPE product to lookup
        in: query
        name: product
        schema:
          type: string
      - description: CPE version to lookup
        in: query
        name: version
        schema:
          type: string
      - description: Filter by vulnerability status (true/false). Defaults to false if not provided.
        in: query
        name: isVulnerable
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/render.ResponseWithMetadata-search_Responses-paginate_Pagination'
          description: OK
        '404':
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Return CPEs and associated CPEs by searching CPE fields
      tags:
      - Endpoints
      operationId: getSearchCpe
      x-operation-id-source: derived
  /search/cve:
    get:
      description: 'Returns all records referencing the specified CVE across all accessible indices. Results are aggregated

        from multiple data sources including advisories, exploits, threat intelligence, and vulnerability databases.

        Metadata is returned in the _meta field.'
      parameters:
      - description: CVE ID to search for (e.g. CVE-2024-1234)
        in: query
        name: cve
        required: true
        schema:
          type: string
      - description: 'Page number (default: 1, page mode only)'
        in: query
        name: page
        schema:
          type: integer
      - description: 'Maximum number of results per page (default: 500, max: 1000)'
        in: query
        name: limit
        schema:
          type: integer
      - description: Continue cursor paging, or use an empty value to start cursor paging
        in: query
        name: cursor
        schema:
          type: string
      - description: Start cursor paging
        in: query
        name: start_cursor
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/render.ResponseWithMetadata-array_index_CveSearchHit-index_CveSearchMeta'
          description: OK
        '400':
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Search all indices for a CVE
      tags:
      - Endpoints
      operationId: getSearchCve
      x-operation-id-source: derived
  /tags/vulncheck-c2:
    get:
      description: Retrieve a list of IP addresses, identified as running Command & Control infrastructure
      parameters:
      - description: 'Format of the IP Addresses in the response (Defaults To: text)'
        in: query
        name: format
        schema:
          enum:
          - txt
          - json
          - text
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: OK
        '404':
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Retrieve a list of C2 IP addresses
      tags:
      - Endpoints
      operationId: getTagsVulncheckC2
      x-operation-id-source: derived
components:
  schemas:
    api.OSSPackageVulnerability:
      properties:
        detection:
          type: string
        fixed_version:
          type: string
      type: object
    v3controllers.ResponseMetadata:
      description: Meta is the metadata related to the endpoint response
      properties:
        cpe:
          type: string
        cpe_struct:
          $ref: '#/components/schemas/api.CPE'
        timestamp:
          type: string
        total_documents:
          type: integer
      type: object
    api.OSSPackageResearchAttributes:
      properties:
        abandoned:
          type: boolean
        eol:
          type: boolean
        is_malicious:
          type: boolean
        malicious_source:
          type: string
        repo_hijackable:
          type: boolean
        squatted_package:
          type: string
      type: object
    v3controllers.PurlResponseMetadata:
      description: Meta is the metadata related to the endpoint response
      properties:
        purl_struct:
          $ref: '#/components/schemas/purl.PackageURLJSON'
        timestamp:
          description: time of the transaction
          type: string
        total_documents:
          description: number of results found
          type: integer
      type: object
    paginate.Pagination:
      description: Meta is the metadata related to the endpoint response
      properties:
        cursor:
          description: 'Cursor is an opaque string representing the current page position for cursor-based pagination.

            Contains encoded information about sort values and position markers.

            Use this value with the ''cursor'' query parameter to resume pagination from this point.'
          type: string
        first_item:
          description: "FirstItem is the 1-indexed position of the first item on the current page.\nExample: Page 1 with limit 100 → FirstItem = 1\n         Page 2 with limit 100 → FirstItem = 101"
          type: integer
        index:
          description: 'Index name being queried, corresponding to the VulnCheck data feed.

            Examples: "exploits", "vulncheck-nvd2", "ipintel-3d", "malicious-vscode-exts"'
          type: string
        last_item:
          description: 'LastItem is the 1-indexed position of the last item on the current page.

            Accounts for partial pages. Example: Page with 50 items → LastItem = FirstItem + 49

            On the final page, LastItem equals TotalRows.'
          type: integer
        limit:
          description: 'Limit is the maximum number of items returned in this response.

            Range: 1-100 for standard indices, 1-10 for large indices.

            Default: 100 (or 10 for indices marked as "large" in metadata)'
          type: integer
        matches:
          description: 'Matches shows the active filter values applied to the current query.

            Each match includes the field name and the value being filtered on.

            Helps users understand which filters are currently active.'
          items:
            $ref: '#/components/schemas/paginate.Match'
          type: array
          uniqueItems: false
        max_pages:
          description: 'MaxPages is the maximum number of pages allowed for offset-based pagination.

            Performance limit to prevent expensive deep pagination. Default: 6 pages.

            When TotalPages > MaxPages, cursor-based pagination should be used instead.'
          type: integer
        next_cursor:
          description: 'NextCursor is an opaque string for fetching the next page in cursor-based pagination.

            When empty or null, indicates no more pages are available.

            More efficient than offset pagination for large datasets and real-time data.'
          type: string
        opensearch_query:
          description: 'OSQuery contains the raw OpenSearch query JSON used internally.

            Only included when show_query=true parameter is set.

            Useful for debugging complex queries and understanding performance.'
          type: object
        order:
          description: 'Order specifies the sort direction: "asc" (ascending) or "desc" (descending).

            Default: "desc" for most time-based indices to show newest items first.'
          type: string
        page:
          description: 'Page is the current page number for offset-based pagination (1-indexed).

            First page = 1, second page = 2, etc. Used with Limit to calculate database offset.

            For cursor-based pagination, this field may be omitted or estimated.'
          type: integer
        pages:
          description: 'Pages contains page numbers to display in pagination UI (e.g., [1, 2, "...", 45]).

            Only populated when ShowPages=true. Includes ellipsis ("...") for gaps.

            Limited by MaxPages to prevent overwhelming UI with too many page links.'
          items:
            type: string
          type: array
          uniqueItems: false
        parameters:
          description: 'Params describes available query parameters for this index.

            Each parameter includes name, format constraints, and filtering capabilities.

            Used for building dynamic query UIs and input validation.'
          items:
            $ref: '#/components/schemas/paginate.Param'
          type: array
          uniqueItems: false
        show_pages:
          description: 'ShowPages controls whether the Pages array should be calculated and included.

            Set to true for UI pagination controls, false for API-only usage to save processing.'
          type: boolean
        show_query:
          description: 'ShowQuery indicates whether the raw OpenSearch query should be included.

            When true, OSQuery field will be populated with the internal query structure.'
          type: boolean
        sort:
          description: 'Sort field used for ordering results. Available fields vary by index.

            Common values: "_timestamp", "date_added", "_id", "lastSeen"

            Affects cursor generation and ensures pagination consistency.'
          type: string
        timestamp:
          description: 'Timestamp when the query was executed in UTC (ISO 8601 format).

            Used for debugging, cache management, and determining data freshness.

            Example: "2024-02-23T20:35:43.732591251Z"'
          type: string
        total_documents:
          description: 'TotalRows is the total number of documents matching the query across all pages.

            Used for calculating total_pages and building pagination UI elements.

            Note: May be capped for performance on very large result sets.'
          type: integer
        total_pages:
          description: 'TotalPages is the total number of pages based on TotalRows and Limit.

            Calculated as: ceil(TotalRows / Limit). Used for pagination UI and validation.

            Example: 1000 items with limit 100 = 10 total pages.'
          type: integer
        warnings:
          description: 'Warnings contains any non-fatal issues encountered during query processing.

            Examples: deprecated parameters, performance concerns, or data quality notes.'
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
