          description: Not Found
        '500':
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                - type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Return a list of indexes with backup and endpoint links
      tags:
      - Endpoints
      operationId: getBackup
      x-operation-id-source: derived
