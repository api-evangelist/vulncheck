  /cpe:
    get:
      description: Based on the specified CPE (Common Platform Enumeration) URI string, this endpoint will return a list of vulnerabilities that are related to the package. We support v2.2 and v2.3
      parameters:
      - description: CPE designation to lookup
        in: query
        name: cpe
        required: true
        schema:
          type: string
      - description: Filter by vulnerability status (true/false). Defaults to false if not provided.
        in: query
        name: isVulnerable
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/render.ResponseWithMetadata-array_string-v3controllers_ResponseMetadata'
          description: OK
        '404':
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Return CVE 's associated with a specific NIST CPE
      tags:
      - Endpoints
      operationId: getCpe
      x-operation-id-source: derived
  /entitlements:
    get:
      description: Retrieve entitlements for the current user
      responses:
        '200':
          content:
            application/json:
              schema:
