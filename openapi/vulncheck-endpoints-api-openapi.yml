      summary: Retrieve user entitlements
      tags:
      - Endpoints
      operationId: getEntitlements
      x-operation-id-source: derived
  /index:
    get:
      description: Return a list of available indexes with endpoint links that the user has access to
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/render.Response-array_params_IndexList'
          description: OK
        '404':
          content:
            application/json:
              schema:
                type: string
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                - type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Return a list of available indexes with endpoint links
      tags:
      - Endpoints
      operationId: getIndex
      x-operation-id-source: derived
  /openapi:
    get:
      description: Return the VulnCheck API (v3) OpenAPI specification
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        '500':
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      security:
      - Bearer: []
      summary: Return OpenAPI specification
      tags:
      - Endpoints
      operationId: getOpenapi
      x-operation-id-source: derived
