note: >-
  Derived from the spec's components.schemas ($ref links and id-reference fields). The graph is
  unusual and the shape is the finding: 786 of 1,409 schemas sit under the `advisory.*`
  namespace, one per upstream data source (advisory.A10, advisory.GitHubExploit,
  advisory.CNVDFlaw, ...), and 484 more are `render.ResponseWithMetadata-<payload>-<meta>`
  envelope permutations generated from Go generics. There is no small core object model with
  relationships between entities; there is one wrapper, one pagination block, and several
  hundred source-shaped record types keyed on shared IDENTIFIERS rather than on foreign keys.
