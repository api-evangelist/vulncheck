identifier_schemes:
  note: >-
    The data model is held together by external identifier standards rather than by internal
    primary keys. This is what makes VulnCheck's data interoperable, and it is the strongest
    domain-standard signal in the contract.
  schemes:
  - id: CVE
    role: Primary cross-index join key. Present as a `cve` filter on index operations and as the sole parameter of /search/cve.
  - id: CPE 2.3
    role: Product identity. /cpe and /search/cpe are built on it; part/vendor/product/version are the search fields.
  - id: PURL (Package URL)
    role: Package identity for ecosystem lookups. Parsed into type/namespace/name/version/qualifiers/subpath.
  - id: IAVA
    role: US DoD Information Assurance Vulnerability Alert id; available as an `iava` filter on index operations.
  - id: alias
    role: Cross-database vulnerability aliases (GHSA, JVNDB, EUVD and others), filterable via `alias`.
