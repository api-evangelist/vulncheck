aid: vulncheck
name: VulnCheck
description: VulnCheck is an exploit and vulnerability intelligence company that supplies machine-readable
  data on known exploited vulnerabilities, exploit maturity, threat-actor activity, initial-access exploitation,
  IP and target intelligence, CPE/PURL identity and vendor advisories. Its Exploit & Vulnerability Intelligence
  platform enriches CVE records ahead of NIST NVD, publishes the VulnCheck KEV catalog, and exposes everything
  through a 521-operation REST API at api.vulncheck.com/v3 covering 490+ named indices, alongside a Go
  SDK, Python SDK, a scripting/agent-oriented CLI, an MCP server and a published Claude Code agent skill.
  A free Community tier provides VulnCheck KEV and NVD++ data.
