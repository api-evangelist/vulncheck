apis:
- aid: vulncheck:vulncheck-api
  name: VulnCheck API
  description: 'Version 3 of the VulnCheck API. A read-only REST API exposing VulnCheck''s exploit and
    vulnerability intelligence: 490+ named indices browsable at /index/{name}, CVE and CPE search, PURL
    vulnerability lookup, initial-access detection rules (Suricata and Snort), VulnCheck C2 hostname and
    tag feeds, entitlements, and pre-signed offline backup downloads. Bearer token authentication; all
    521 operations are GET.'
