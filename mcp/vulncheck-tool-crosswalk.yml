  below identify operations by METHOD + PATH rather than by operationId. This is a real gap in
  the contract, not a shortcut here — see conformance/vulncheck-conformance.yml. The MCP server
  is stdio-only, so tool inputSchemas could not be introspected live; bindings are mapped by
  name and by the provider's own published tool descriptions, and confidence is set accordingly.
