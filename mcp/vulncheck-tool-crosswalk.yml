mcp_only:
- tool: describe_index
  reason: >-
    Reports an index's accepted filters and size. No REST operation returns index metadata of
    this shape; /index returns names and endpoint links only. Composite/introspective.
- tool: search_docs
  reason: Searches docs.vulncheck.com, not the v3 API. No REST equivalent.
- tool: get_doc
  reason: Fetches raw documentation markdown from docs.vulncheck.com. No REST equivalent.
- tool: identify_component
