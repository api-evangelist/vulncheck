domain_standards:
  note: >-
    VulnCheck's market is vulnerability intelligence, and the contract declares the sector's
    identifier and exchange standards directly in its parameters and schemas rather than only
    claiming them in marketing prose. These are the standards a buyer already speaks, and
    conformance means no bespoke connector is needed.
  standards:
  - id: cve
    name: CVE (Common Vulnerabilities and Exposures)
    conforms: true
    evidence: >-
      `cve` is a declared query parameter on the index operations and the sole parameter of
      GET /search/cve (openapi/vulncheck-api-openapi.json, paths./search/cve.get.parameters).
  - id: cpe-2.3
    name: CPE 2.3 (Common Platform Enumeration, NIST IR 7695)
    conforms: true
    evidence: >-
      GET /cpe takes a `cpe` parameter documented as "a specific NIST CPE"; GET /search/cpe
      decomposes it into the CPE 2.3 attribute set part/vendor/product/version. Schemas
      advisory.CPEMatch, advisory.CPENode, advisory.CustomCPE and the vc-cpe-dictionary and
      nvd-cpe-dictionary indices carry the dictionary itself.
  - id: purl
    name: Package URL (PURL) specification
    conforms: true
    evidence: >-
      GET /purl and POST /purls are PURL-native; purl.PackageURLJSON models the spec's
      type/namespace/name/version/qualifiers/subpath fields exactly, and
      purl.QualifierJSON models its key/value qualifiers.
  - id: nvd-cve-json
    name: NVD CVE JSON 2.0 / NVD++
    conforms: true
    evidence: >-
      The nist-nvd, nist-nvd2, vulncheck-nvd and vulncheck-nvd2 indices are addressable
      operations in the spec, and the community docs state NVD++ provides
      "access from a single source to NIST NVD (enriched w/ VulnCheck CPE)"
      (https://docs.vulncheck.com/community/nist-nvd).
  - id: kev
    name: Known Exploited Vulnerabilities catalog (CISA KEV / VulnCheck KEV)
    conforms: true
    evidence: >-
      GET /index/cisa-kev and GET /index/vulncheck-kev are both declared operations; the
      published KEV schema is documented at
      https://docs.vulncheck.com/community/vulncheck-kev/schema.
  - id: iava
    name: IAVA (US DoD Information Assurance Vulnerability Alert)
    conforms: true
    evidence: '`iava` is a declared query parameter on the index operations.'
  - id: suricata-snort
    name: Suricata and Snort detection rule formats
    conforms: true
    evidence: >-
      GET /rules/initial-access/{type} serves detection rules with `type` restricted to
      suricata and snort; the emerging-threats-snort index is a declared operation.
  - id: ghsa-osv
    name: GHSA / OSV advisory identifiers
    conforms: true
    evidence: >-
      github-security-advisories, osv, pypa-advisories, rustsec-advisories and
      gitlab-advisories-community are declared index operations; the MCP v4_search_advisory
      tool is documented as the path to GHSA records for npm, PyPI and Go.
  - id: epss
    name: EPSS (Exploit Prediction Scoring System)
    conforms: true
    evidence: 'The epss index was added in the 2023-10-11 release notes and is a declared index operation.'
  - id: mitre-attack
    name: MITRE ATT&CK
    conforms: true
    evidence: 'The mitre-attack-cve index was added in the 2023-12-05 release notes and is a declared index operation.'
